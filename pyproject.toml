[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tidyenv"
dynamic = ["version"]
description = "Typed environment variables with friendly errors and built-in .env support."
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Lena Barretta" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["environment", "env", "config", "settings", "12-factor", "dotenv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/LenaBarretta/tidyenv"
Issues = "https://github.com/LenaBarretta/tidyenv/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    # tests/test_compat.py checks tidyenv against it; 1.2.4 needs Python 3.10+.
    "python-dotenv>=1.2.4; python_version >= '3.10'",
]

[tool.hatch.build.targets.sdist]
exclude = ["docs"]

[tool.hatch.version]
path = "src/tidyenv/__init__.py"

[tool.pytest.ini_options]
addopts = "-q --cov=tidyenv --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["dotenv"]  # not installed on Python 3.9
ignore_missing_imports = true
